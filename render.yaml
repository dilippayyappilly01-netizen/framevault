services:
  - type: web
    name: framevault
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/framevault.sqlite
      - key: ALLOW_DEMO_CHECKOUT
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: LICENSE_CURRENCY
        value: USD
      - key: LICENSE_PRICE_CENTS
        value: "499"
      - key: LICENSE_PRICE_DISPLAY
        value: $4.99
      - key: ORIGINKIT_SECRET
        generateValue: true
      - key: OWNER_LICENSE_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: FrameVault <receipts@framevault.dev>
