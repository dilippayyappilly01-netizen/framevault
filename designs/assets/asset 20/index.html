<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset 20 — 3D Interactive Cursor-Repelled Bubble Sphere</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }

  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>
<canvas id="glCanvas"></canvas>

<script>
(() => {
  const canvas = document.getElementById('glCanvas');
  const gl = canvas.getContext('webgl2', { antialias: true }) ||
             canvas.getContext('webgl', { antialias: true });
  if (!gl) return;

  const vsSource = `
    attribute vec3 aPos;
    attribute float aRadius;
    attribute vec3 aColor;

    uniform vec2 uResolution;

    varying vec3 vColor;
    varying float vDepth;

    void main() {
      float fov = 3.2;
      float persp = fov / (fov - aPos.z * 0.52);

      float aspect = uResolution.x / max(uResolution.y, 1.0);
      float scale = 0.68;

      gl_Position = vec4(
        (aPos.x * scale * persp) / aspect,
        aPos.y * scale * persp,
        0.0,
        1.0
      );

      gl_PointSize = aRadius * uResolution.y * 1.38 * persp;
      vColor = aColor;
      vDepth = smoothstep(-1.15, 1.05, aPos.z);
    }
  `;

  const fsSource = `
    precision highp float;
    varying vec3 vColor;
    varying float vDepth;

    void main() {
      vec2 p = (gl_PointCoord - 0.5) * 2.0;
      p.y = -p.y;
      float r2 = dot(p, p);
      if (r2 > 1.0) discard;

      float z = sqrt(max(0.0, 1.0 - r2));
      vec3 n = vec3(p, z);

      vec3 lightDir = normalize(vec3(0.45, 0.55, 0.70));
      float diff = max(0.0, dot(n, lightDir));
      float fresnel = pow(1.0 - z, 1.85);
      float spec = pow(max(0.0, dot(reflect(-lightDir, n), vec3(0.0, 0.0, 1.0))), 22.0);

      vec3 base = vColor * (0.42 + 0.62 * diff);
      vec3 rim  = mix(vColor * 1.35, vec3(0.88, 0.96, 1.0), 0.55) * fresnel * 0.78;
      vec3 col  = (base + rim + vec3(0.9, 0.97, 1.0) * spec * 0.52) * mix(0.28, 1.05, vDepth);

      float edgeAA = 1.0 - smoothstep(0.88, 1.0, r2);
      float alpha = mix(0.68, 0.95, fresnel) * edgeAA * mix(0.45, 1.0, vDepth);

      gl_FragColor = vec4(col, alpha);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSource));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const COUNT = 820;
  const GOLDEN_ANGLE = Math.PI * (3.0 - Math.sqrt(5.0));
  const bubbles = new Array(COUNT);

  for (let i = 0; i < COUNT; i++) {
    const y = 1.0 - (i / (COUNT - 1)) * 2.0;
    const r = Math.sqrt(Math.max(0.0, 1.0 - y * y));
    const theta = GOLDEN_ANGLE * i;
    const x = Math.cos(theta) * r;
    const z = Math.sin(theta) * r;

    const uX = Math.max(0.0, Math.min(1.0, (x + 1.0) * 0.5));
    const scatter = Math.pow(1.0 - uX, 2.2) * 0.28;
    const bx = x - scatter * (0.3 + Math.random() * 0.9);
    const by = y * (1.0 + (Math.random() - 0.5) * scatter * 0.45);
    const bz = z * (1.0 + (Math.random() - 0.5) * scatter * 0.45);

    const baseRadius = 0.007 + Math.pow(uX, 0.85) * 0.046 * (0.82 + Math.random() * 0.32);

    let cr, cg, cb;
    const rnd = Math.random();
    if (uX > 0.58) {
      if (rnd < 0.45)      { cr = 0.48; cg = 0.86; cb = 1.00; }
      else if (rnd < 0.80) { cr = 0.24; cg = 0.66; cb = 0.98; }
      else                 { cr = 0.68; cg = 0.92; cb = 1.00; }
    } else {
      if (rnd < 0.16)      { cr = 0.12; cg = 0.74; cb = 0.62; }
      else if (y > 0.15)   { cr = 0.38; cg = 0.34; cb = 0.94; }
      else                 { cr = 0.14; cg = 0.32; cb = 0.88; }
    }

    bubbles[i] = {
      bx, by, bz,
      cx: bx, cy: by, cz: bz,
      vx: 0, vy: 0, vz: 0,
      radius: baseRadius,
      cr, cg, cb,
      phase: Math.random() * Math.PI * 2
    };
  }

  const posArray = new Float32Array(COUNT * 3);
  const radArray = new Float32Array(COUNT);
  const colArray = new Float32Array(COUNT * 3);

  const posBuf = gl.createBuffer();
  const radBuf = gl.createBuffer();
  const colBuf = gl.createBuffer();

  const aPosLoc = gl.getAttribLocation(prog, 'aPos');
  const aRadLoc = gl.getAttribLocation(prog, 'aRadius');
  const aColLoc = gl.getAttribLocation(prog, 'aColor');
  const uResLoc = gl.getUniformLocation(prog, 'uResolution');

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  let ptrX = -999;
  let ptrY = -999;
  let ptrActive = false;

  window.addEventListener('pointermove', (e) => {
    const vw = Math.max(window.innerWidth, 1);
    const vh = Math.max(window.innerHeight, 1);
    const aspect = vw / vh;
    const ndcX = ((e.clientX / vw) * 2 - 1) * aspect;
    const ndcY = 1 - (e.clientY / vh) * 2;
    ptrX = ndcX / 0.68;
    ptrY = ndcY / 0.68;
    ptrActive = true;
  });

  window.addEventListener('pointerleave', () => {
    ptrActive = false;
  });

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0.0, 0.0, 0.0, 1.0);

  const sortedIndices = Array.from({ length: COUNT }, (_, i) => i);

  function render(now) {
    const t = now * 0.001;
    const rotY = Math.sin(t * 0.45) * 0.14;
    const rotX = Math.cos(t * 0.38) * 0.08;
    const cy = Math.cos(rotY), sy = Math.sin(rotY);
    const cx = Math.cos(rotX), sx = Math.sin(rotX);

    for (let i = 0; i < COUNT; i++) {
      const b = bubbles[i];

      const rx1 = b.bx * cy - b.bz * sy;
      const rz1 = b.bx * sy + b.bz * cy;
      const ry2 = b.by * cx - rz1 * sx;
      const rz2 = b.by * sx + rz1 * cx;

      const tx = rx1 + Math.sin(t * 1.4 + b.phase) * 0.008;
      const ty = ry2 + Math.cos(t * 1.2 + b.phase) * 0.008;
      const tz = rz2;

      let fx = (tx - b.cx) * 0.085;
      let fy = (ty - b.cy) * 0.085;
      let fz = (tz - b.cz) * 0.085;

      if (ptrActive && b.cz > -0.35) {
        const dx = b.cx - ptrX;
        const dy = b.cy - ptrY;
        const dist2D = Math.hypot(dx, dy);
        const repelRadius = 0.44;
        if (dist2D < repelRadius && dist2D > 0.001) {
          const force = Math.pow(1.0 - dist2D / repelRadius, 2.0) * 0.068;
          fx += (dx / dist2D) * force;
          fy += (dy / dist2D) * force;
          fz -= force * 0.25;
        }
      }

      b.vx = (b.vx + fx) * 0.82;
      b.vy = (b.vy + fy) * 0.82;
      b.vz = (b.vz + fz) * 0.82;

      b.cx += b.vx;
      b.cy += b.vy;
      b.cz += b.vz;
    }

    sortedIndices.sort((a, b) => bubbles[a].cz - bubbles[b].cz);

    for (let i = 0; i < COUNT; i++) {
      const b = bubbles[sortedIndices[i]];
      posArray[i * 3]     = b.cx;
      posArray[i * 3 + 1] = b.cy;
      posArray[i * 3 + 2] = b.cz;
      radArray[i]         = b.radius;
      colArray[i * 3]     = b.cr;
      colArray[i * 3 + 1] = b.cg;
      colArray[i * 3 + 2] = b.cb;
    }

    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uResLoc, canvas.width, canvas.height);

    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferData(gl.ARRAY_BUFFER, posArray, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(aPosLoc);
    gl.vertexAttribPointer(aPosLoc, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, radBuf);
    gl.bufferData(gl.ARRAY_BUFFER, radArray, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(aRadLoc);
    gl.vertexAttribPointer(aRadLoc, 1, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
    gl.bufferData(gl.ARRAY_BUFFER, colArray, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(aColLoc);
    gl.vertexAttribPointer(aColLoc, 3, gl.FLOAT, false, 0, 0);

    gl.drawArrays(gl.POINTS, 0, COUNT);
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
