<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIGHT / WAVE / SPACE / FUTURE — Concave Panorama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ededed;
      color: #222;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Four Corner Labels matching the video */
    .corner {
      position: fixed;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #2b2b2b;
      z-index: 30;
      pointer-events: none;
    }

    .corner-tl { top: 34px; left: 42px; }
    .corner-tr { top: 34px; right: 42px; }
    .corner-bl { bottom: 34px; left: 42px; }
    .corner-br { bottom: 34px; right: 42px; }

    /* 3D Concave Cylindrical Viewport */
    .viewport {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 720px;
      perspective-origin: 50% 50%;
      cursor: grab;
      touch-action: none;
      overflow: hidden;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .cylinder-stage {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .pano-card {
      position: absolute;
      width: 156px;
      height: 210px;
      margin-left: -78px;
      margin-top: -105px;
      border-radius: 10px;
      overflow: hidden;
      background: #dcdcdc;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform, opacity;
    }

    .pano-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
    }
  </style>
</head>
<body>

  <div class="corner corner-tl">LIGHT</div>
  <div class="corner corner-tr">WAVE</div>
  <div class="corner corner-bl">SPACE</div>
  <div class="corner corner-br">FUTURE</div>

  <div class="viewport" id="viewport">
    <div class="cylinder-stage" id="stage"></div>
  </div>

  <script>
    const IMAGES = [
      'images/1.jpg',
      'images/2.jpg',
      'images/3.jpg',
      'images/4.jpg',
      'images/5.jpg',
      'images/6.jpg',
      'images/7.jpg',
      'images/8.jpg',
      'images/9.jpg',
      'images/10.jpg',
      'images/11.jpg',
      'images/12.jpg'
    ];

    const stage = document.getElementById('stage');
    const viewport = document.getElementById('viewport');

    // 24 cards around the full interior of the concave cylinder
    const TOTAL_SLOTS = 24;
    const STEP_RAD = (Math.PI * 2) / TOTAL_SLOTS;
    const RADIUS = 640;
    const cards = [];

    for (let i = 0; i < TOTAL_SLOTS; i++) {
      const el = document.createElement('div');
      el.className = 'pano-card';
      const src = IMAGES[i % IMAGES.length];
      el.innerHTML = `<img src="${src}" alt="Panorama ${i + 1}" loading="eager" decoding="sync" fetchpriority="high">`;
      stage.appendChild(el);
      cards.push({ el, index: i });
    }

    let currentAngle = 0;
    let targetAngle = 0;
    let isDragging = false;
    let lastX = 0;
    let lastTime = 0;
    let velocity = 0;
    let autoDrift = true;

    function renderPanorama() {
      if (autoDrift && !isDragging) {
        targetAngle -= 0.0016;
      }

      if (!isDragging) {
        currentAngle += (targetAngle - currentAngle) * 0.1;
      } else {
        currentAngle = targetAngle;
      }

      cards.forEach(({ el, index }) => {
        // Normalize angle to [-PI, +PI] where 0 is dead-center at the back of the concave arc
        let theta = (index * STEP_RAD + currentAngle) % (Math.PI * 2);
        if (theta > Math.PI) theta -= Math.PI * 2;
        if (theta < -Math.PI) theta += Math.PI * 2;

        // Only show the front concave half-cylinder [-PI * 0.48, +PI * 0.48]
        if (Math.abs(theta) > Math.PI * 0.48) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          return;
        }

        // Concave cylinder coordinates:
        // At theta = 0 (center), z is far back (-360px).
        // As |theta| approaches PI/2 (left & right screen edges), z comes forward toward the camera (+280px)!
        const x = RADIUS * Math.sin(theta);
        const z = 280 - RADIUS * Math.cos(theta);
        const rotY = (-theta * 180) / Math.PI;

        el.style.opacity = '1';
        el.style.pointerEvents = 'auto';
        el.style.transform = `translate3d(${x.toFixed(2)}px, 0, ${z.toFixed(2)}px) rotateY(${rotY.toFixed(2)}deg)`;
        el.style.zIndex = Math.round(z + 1000);
      });

      requestAnimationFrame(renderPanorama);
    }

    viewport.addEventListener('pointerdown', (e) => {
      isDragging = true;
      autoDrift = false;
      lastX = e.clientX;
      lastTime = performance.now();
      velocity = 0;
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const now = performance.now();
      const dx = e.clientX - lastX;
      const dt = Math.max(1, now - lastTime);

      const dAngle = dx * 0.0022;
      targetAngle += dAngle;
      velocity = dAngle / dt;

      lastX = e.clientX;
      lastTime = now;
    });

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      targetAngle += velocity * 160;
      setTimeout(() => {
        if (!isDragging) autoDrift = true;
      }, 2000);
    }

    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      autoDrift = false;
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      targetAngle -= delta * 0.0012;
      clearTimeout(window._panoTimer);
      window._panoTimer = setTimeout(() => { autoDrift = true; }, 2000);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') targetAngle += STEP_RAD;
      if (e.key === 'ArrowRight') targetAngle -= STEP_RAD;
    });

    requestAnimationFrame(renderPanorama);
  </script>
</body>
</html>
