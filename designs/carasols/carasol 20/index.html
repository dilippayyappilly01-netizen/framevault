<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel 20 — Infinite 3D Parallax Square Photo Field</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000000;
    cursor: grab;
    perspective: 1200px;
  }

  #viewport:active {
    cursor: grabbing;
  }

  .tile {
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 16px;
    overflow: hidden;
    will-change: transform;
    background: #111;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.78);
    transition: box-shadow 0.25s ease;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }

  .tile:hover {
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.22);
    z-index: 9999 !important;
  }

  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    image-rendering: high-quality;
    -webkit-user-drag: none;
    transform: translateZ(0);
  }

  /* Subtle corner controls matching recording */
  .corner-btn {
    position: fixed;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: rgba(255, 255, 255, 0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10000;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .corner-btn:hover {
    background: rgba(255, 255, 255, 0.22);
    transform: scale(1.06);
  }

  .btn-top-left {
    top: 18px;
    left: 18px;
  }

  .btn-top-right {
    top: 18px;
    right: 18px;
  }

  /* Lightbox modal when clicking a photo tile */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.86);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    z-index: 20000;
  }

  #lightbox.open {
    opacity: 1;
    pointer-events: auto;
  }

  #lightbox img {
    max-width: 82vw;
    max-height: 82vh;
    border-radius: 20px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.9);
    object-fit: contain;
    image-rendering: high-quality;
  }
</style>
</head>
<body>
<div id="viewport"></div>

<button class="corner-btn btn-top-left" id="resetBtn" title="Reset Drift">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
  </svg>
</button>

<button class="corner-btn btn-top-right" id="zoomBtn" title="Toggle Depth Zoom">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="3"/>
    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
  </svg>
</button>

<div id="lightbox">
  <img id="lightboxImg" src="images/1.jpg" alt="">
</div>

<script>
(() => {
  const viewport = document.getElementById('viewport');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const resetBtn = document.getElementById('resetBtn');
  const zoomBtn = document.getElementById('zoomBtn');

  const IMAGES = Array.from({ length: 12 }, (_, i) => `images/${i + 1}.jpg`);

  // Virtual infinite field dimensions
  let vw = window.innerWidth;
  let vh = window.innerHeight;
  let fieldW = Math.max(vw * 2.3, 2800);
  let fieldH = Math.max(vh * 2.3, 2000);

  // Create 36 square photo tiles across multiple Z-depth layers
  const NUM_TILES = 36;
  const tiles = [];

  // Deterministic well-spaced Halton-like distribution so tiles fill the infinite space naturally
  function halton(index, base) {
    let result = 0;
    let f = 1 / base;
    let i = index;
    while (i > 0) {
      result += f * (i % base);
      i = Math.floor(i / base);
      f /= base;
    }
    return result;
  }

  for (let i = 0; i < NUM_TILES; i++) {
    const el = document.createElement('div');
    el.className = 'tile';

    const img = document.createElement('img');
    const src = IMAGES[i % IMAGES.length];
    img.src = src;
    img.alt = `Photo ${(i % IMAGES.length) + 1}`;
    img.loading = 'eager';
    img.decoding = 'sync';
    img.fetchPriority = 'high';
    el.appendChild(img);
    viewport.appendChild(el);

    // Depth layer factor: 0.18 (far small) to 1.0 (foreground large)
    const depthTier = (i % 6) / 5; // 6 distinct parallax planes
    const depth = 0.22 + depthTier * 0.78;
    const size = Math.round(74 + Math.pow(depth, 1.35) * 205);
    const radius = Math.round(8 + depth * 12);

    el.style.width = `${size}px`;
    el.style.height = `${size}px`;
    el.style.borderRadius = `${radius}px`;
    el.style.zIndex = String(Math.round(depth * 1000) + i);

    const bx = (halton(i + 1, 2) - 0.5) * fieldW;
    const by = (halton(i + 1, 3) - 0.5) * fieldH;

    el.addEventListener('click', (e) => {
      if (dragMoved > 6) return;
      e.stopPropagation();
      lightboxImg.src = src;
      lightbox.classList.add('open');
    });

    tiles.push({
      el,
      bx,
      by,
      depth,
      size,
      hoverScale: 1,
      targetHoverScale: 1
    });

    el.addEventListener('pointerenter', () => {
      tiles[i].targetHoverScale = 1.07;
    });
    el.addEventListener('pointerleave', () => {
      tiles[i].targetHoverScale = 1.0;
    });
  }

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('open');
  });

  // Camera pan & momentum state
  let camX = 0;
  let camY = 0;
  let velX = -1.6;
  let velY = -0.95;
  let targetVelX = -1.6;
  let targetVelY = -0.95;

  let isDragging = false;
  let lastX = 0;
  let lastY = 0;
  let dragMoved = 0;
  let globalZoom = 1.0;
  let targetZoom = 1.0;

  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.corner-btn') || lightbox.classList.contains('open')) return;
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    dragMoved = 0;
  });

  window.addEventListener('pointermove', (e) => {
    if (isDragging) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      dragMoved += Math.hypot(dx, dy);

      camX += dx * 1.35;
      camY += dy * 1.35;
      velX = dx * 0.95;
      velY = dy * 0.95;
    } else {
      // Gentle pointer-steered drift matching the video recording
      const nx = (e.clientX / Math.max(vw, 1)) - 0.5;
      const ny = (e.clientY / Math.max(vh, 1)) - 0.5;
      targetVelX = -nx * 5.2;
      targetVelY = -ny * 5.2;
    }
  });

  window.addEventListener('pointerup', () => {
    isDragging = false;
  });

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    camX -= e.deltaX * 1.1;
    camY -= e.deltaY * 1.1;
    velX = -e.deltaX * 0.35;
    velY = -e.deltaY * 0.35;
  }, { passive: false });

  resetBtn.addEventListener('click', () => {
    targetVelX = -1.8;
    targetVelY = -1.1;
    targetZoom = 1.0;
  });

  zoomBtn.addEventListener('click', () => {
    targetZoom = targetZoom > 1.05 ? 1.0 : 1.24;
  });

  window.addEventListener('resize', () => {
    vw = window.innerWidth;
    vh = window.innerHeight;
    fieldW = Math.max(vw * 2.3, 2800);
    fieldH = Math.max(vh * 2.3, 2000);
  });

  function wrap(val, span) {
    const half = span * 0.5;
    return ((((val + half) % span) + span) % span) - half;
  }

  function animate() {
    if (!isDragging) {
      velX += (targetVelX - velX) * 0.04;
      velY += (targetVelY - velY) * 0.04;
      camX += velX;
      camY += velY;
    }

    globalZoom += (targetZoom - globalZoom) * 0.07;

    const cx = vw * 0.5;
    const cy = vh * 0.5;

    for (let i = 0; i < NUM_TILES; i++) {
      const t = tiles[i];
      t.hoverScale += (t.targetHoverScale - t.hoverScale) * 0.14;

      // Multi-plane parallax speed proportional to depth
      const parallax = 0.28 + t.depth * 1.15;
      const wx = wrap(t.bx + camX * parallax, fieldW);
      const wy = wrap(t.by + camY * parallax, fieldH);

      const scale = globalZoom * t.hoverScale;
      const x = cx + wx * globalZoom - (t.size * 0.5);
      const y = cy + wy * globalZoom - (t.size * 0.5);

      t.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${scale.toFixed(3)})`;
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
