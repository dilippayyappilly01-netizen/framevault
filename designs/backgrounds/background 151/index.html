<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 151 — Interactive Character Wave Matrix</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07090f; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  const CHARS = ' .,:;-=+*#%@';
  let w = 0, h = 0, dpr = 1, ptrX = -999, ptrY = -999, waveT = -99, waveX = 0, waveY = 0, scale = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { ptrX = e.clientX; ptrY = e.clientY; });
  window.addEventListener('pointerleave', () => { ptrX = -999; ptrY = -999; });
  window.addEventListener('pointerdown', (e) => { waveX = e.clientX; waveY = e.clientY; waveT = performance.now() * 0.001; });
  window.addEventListener('wheel', (e) => { scale = Math.max(0.7, Math.min(1.6, scale - e.deltaY * 0.0005)); }, { passive: true });
  function animate(now) {
    const t = now * 0.001;
    ctx.fillStyle = '#07090f'; ctx.fillRect(0, 0, w, h);
    const cell = Math.round(20 * scale);
    ctx.font = `600 ${Math.round(13 * scale)}px monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const age = Math.max(0, t - waveT);
    for (let y = cell * 0.5; y < h; y += cell) {
      for (let x = cell * 0.5; x < w; x += cell) {
        let v = Math.sin(x * 0.015 + t * 1.8) * Math.cos(y * 0.015 - t * 1.3) * 0.5 + 0.5;
        const d = Math.hypot(x - ptrX, y - ptrY);
        const boost = Math.exp(-d * d / 24000);
        const wd = Math.hypot(x - waveX, y - waveY);
        const ring = Math.exp(-Math.pow(wd - age * 420, 2) / 2800) * Math.exp(-age * 1.4);
        const energy = Math.min(1, v * 0.68 + boost * 0.65 + ring * 0.85);
        const idx = Math.min(CHARS.length - 1, Math.floor(energy * CHARS.length));
        if (idx === 0) continue;
        const r = Math.round(56 + energy * 165);
        const g = Math.round(130 + energy * 115);
        const b = 255;
        ctx.fillStyle = `rgba(${r},${g},${b},${(0.22 + energy * 0.78).toFixed(3)})`;
        ctx.fillText(CHARS[idx], x, y);
      }
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
