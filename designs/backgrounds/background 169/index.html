<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 169 — Stage Volumetric Spotlight Beams</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060b; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, ptrX = 0.5, ptrY = 0.65, tX = 0.5, tY = 0.65, flash = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { tX = e.clientX / Math.max(w, 1); tY = e.clientY / Math.max(h, 1); });
  window.addEventListener('pointerdown', () => { flash = 1.0; });
  const cols = ['56,189,248', '168,85,247', '244,114,182', '34,211,238', '129,140,248'];
  function animate(now) {
    const t = now * 0.001; ptrX += (tX - ptrX) * 0.07; ptrY += (tY - ptrY) * 0.07; flash *= 0.92;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#05060b'; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const sx = w * (0.1 + i * 0.2);
      const tx = ptrX * w + Math.sin(t * (0.7 + i * 0.15) + i * 1.4) * 160;
      const ty = h + 80;
      const spread = 85 + flash * 60;
      const g = ctx.createLinearGradient(sx, 0, tx, ty);
      g.addColorStop(0, `rgba(${cols[i]}, ${(0.32 + flash * 0.25).toFixed(3)})`);
      g.addColorStop(1, `rgba(${cols[i]}, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(sx - 8, -10); ctx.lineTo(sx + 8, -10); ctx.lineTo(tx + spread, ty); ctx.lineTo(tx - spread, ty); ctx.closePath(); ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
