<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 223 — Misty Alpine Horizon Parallax</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, px = 0, tpx = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { tpx = (e.clientX / Math.max(w, 1) - 0.5) * 180; });
  const cols = ['#334155', '#273449', '#1e293b', '#172033', '#0f172a', '#090e1a'];
  function animate(now) {
    const t = now * 0.0002; px += (tpx - px) * 0.05;
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#1e293b'); sky.addColorStop(0.55, '#475569'); sky.addColorStop(1, '#090e1a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
    for (let l = 0; l < cols.length; l++) {
      const baseY = h * (0.42 + l * 0.095), amp = 45 + l * 10, shift = t * (40 + l * 35) + px * (0.2 + l * 0.22);
      ctx.fillStyle = cols[l];
      ctx.beginPath(); ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 12) {
        const nx = (x + shift) * (0.0045 + l * 0.0012);
        const y = baseY - Math.sin(nx) * amp - Math.cos(nx * 2.3 + l) * (amp * 0.45);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
