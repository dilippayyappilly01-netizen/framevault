<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 207 — Glowing Cellular Automata Life</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070e; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, cols = 0, rows = 0, cell = 14, grid = [], heat = [], frame = 0;
  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / cell); rows = Math.ceil(h / cell);
    grid = Array.from({ length: cols * rows }, () => (Math.random() > 0.78 ? 1 : 0));
    heat = new Float32Array(cols * rows);
  }
  window.addEventListener('resize', build); build();
  function paint(x, y) {
    const cx = Math.floor(x / cell), cy = Math.floor(y / cell);
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const nx = (cx + dx + cols) % cols, ny = (cy + dy + rows) % rows;
      if (Math.random() > 0.35) grid[ny * cols + nx] = 1;
    }
  }
  window.addEventListener('pointermove', (e) => { paint(e.clientX, e.clientY); });
  window.addEventListener('pointerdown', (e) => { paint(e.clientX, e.clientY); });
  function step() {
    const next = new Array(cols * rows);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      let n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        n += grid[((y + dy + rows) % rows) * cols + ((x + dx + cols) % cols)];
      }
      const idx = y * cols + x;
      next[idx] = grid[idx] ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
    }
    grid = next;
  }
  function animate() {
    if (++frame % 5 === 0) step();
    ctx.fillStyle = '#05070e'; ctx.fillRect(0, 0, w, h);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const idx = y * cols + x;
      heat[idx] = grid[idx] ? 1 : heat[idx] * 0.9;
      if (heat[idx] < 0.04) continue;
      ctx.fillStyle = `rgba(56, 189, 248, ${(heat[idx] * 0.85).toFixed(3)})`;
      ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
