<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 215 — Cinematic Camera Lens Bokeh Orbs</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0710; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, px = 0, py = 0, tpx = 0, tpy = 0;
  const orbs = [];
  const COLS = ['251,146,60', '244,114,182', '129,140,248', '56,189,248', '253,224,71'];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!orbs.length) for (let i = 0; i < 36; i++) orbs.push({
      x: Math.random() * w, y: Math.random() * h, r: 28 + Math.random() * 88,
      vx: (Math.random() - 0.5) * 0.35, vy: -0.15 - Math.random() * 0.3, z: 0.3 + Math.random() * 0.9, col: COLS[i % COLS.length]
    });
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { tpx = (e.clientX / Math.max(w, 1) - 0.5) * 60; tpy = (e.clientY / Math.max(h, 1) - 0.5) * 60; });
  function animate() {
    px += (tpx - px) * 0.05; py += (tpy - py) * 0.05;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0a0710'; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i]; o.x += o.vx; o.y += o.vy;
      if (o.y < -o.r) { o.y = h + o.r; o.x = Math.random() * w; }
      const ox = o.x + px * o.z, oy = o.y + py * o.z;
      const g = ctx.createRadialGradient(ox, oy, o.r * 0.2, ox, oy, o.r);
      g.addColorStop(0, `rgba(${o.col}, 0.14)`);
      g.addColorStop(0.85, `rgba(${o.col}, 0.22)`);
      g.addColorStop(1, `rgba(${o.col}, 0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, o.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
