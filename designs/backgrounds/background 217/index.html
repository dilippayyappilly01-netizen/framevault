<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 217 — Low-Poly Origami Shimmer Mesh</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f1d; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, cols = 14, rows = 9, pts = [], ptrX = 0, ptrY = 0;
  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ptrX = w * 0.5; ptrY = h * 0.5; pts = [];
    for (let r = 0; r <= rows; r++) for (let c = 0; c <= cols; c++) {
      const edge = r === 0 || r === rows || c === 0 || c === cols;
      pts.push({ bx: (c / cols) * w, by: (r / rows) * h, ox: edge ? 0 : (Math.random() - 0.5) * 34, oy: edge ? 0 : (Math.random() - 0.5) * 34, ph: Math.random() * 6.28 });
    }
  }
  window.addEventListener('resize', build); build();
  window.addEventListener('pointermove', (e) => { ptrX = e.clientX; ptrY = e.clientY; });
  function drawTri(a, b, c) {
    const cx = (a[0] + b[0] + c[0]) / 3, cy = (a[1] + b[1] + c[1]) / 3;
    const d = Math.hypot(cx - ptrX, cy - ptrY);
    const lit = Math.exp(-d * d / 90000);
    const l = Math.round(14 + lit * 44 + (cx / w) * 14);
    ctx.fillStyle = `hsl(${Math.round(215 + lit * 35)}, 72%, ${l}%)`;
    ctx.strokeStyle = 'rgba(147, 197, 253, 0.14)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  function animate(now) {
    const t = now * 0.001;
    const pos = pts.map((p) => [p.bx + p.ox + Math.sin(t + p.ph) * 8, p.by + p.oy + Math.cos(t * 0.9 + p.ph) * 8]);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * (cols + 1) + c;
      drawTri(pos[i], pos[i + 1], pos[i + cols + 1]);
      drawTri(pos[i + 1], pos[i + cols + 2], pos[i + cols + 1]);
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
