<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 209 — Harmonic Pendulum Wave Illusion</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07060d; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, speed = 1, ptrY = 0.5;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { ptrY = e.clientY / Math.max(h, 1); });
  window.addEventListener('pointerdown', () => { speed = speed > 1.5 ? 1 : 2.2; });
  function animate(now) {
    const t = now * 0.001 * speed;
    ctx.fillStyle = 'rgba(7, 6, 13, 0.28)'; ctx.fillRect(0, 0, w, h);
    const N = 28;
    for (let i = 0; i < N; i++) {
      const u = i / (N - 1);
      const y = h * (0.12 + u * 0.76);
      const freq = 0.8 + i * 0.075;
      const x = w * 0.5 + Math.sin(t * freq) * w * (0.25 + ptrY * 0.16);
      ctx.strokeStyle = 'rgba(167, 139, 250, 0.12)';
      ctx.beginPath(); ctx.moveTo(w * 0.5, y); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = `hsl(${Math.round(230 + u * 110)}, 90%, 68%)`;
      ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
