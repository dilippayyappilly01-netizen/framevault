<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 225 — Glowing Honeycomb Beehive Pulse</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0804; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, ptrX = -999, ptrY = -999;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { ptrX = e.clientX; ptrY = e.clientY; });
  function animate(now) {
    const t = now * 0.001;
    ctx.fillStyle = '#0a0804'; ctx.fillRect(0, 0, w, h);
    const r = 30, dx = r * 1.732, dy = r * 1.5;
    for (let row = -1; row < h / dy + 2; row++) {
      for (let col = -1; col < w / dx + 2; col++) {
        const cx = col * dx + (row % 2 ? dx * 0.5 : 0), cy = row * dy;
        const d = Math.hypot(cx - ptrX, cy - ptrY);
        const pulse = Math.exp(-d * d / 26000) + (0.5 + 0.5 * Math.sin(cx * 0.012 - t * 1.8 + cy * 0.008)) * 0.28;
        ctx.strokeStyle = `rgba(245, 158, 11, ${Math.min(0.95, 0.1 + pulse * 0.75).toFixed(3)})`;
        ctx.lineWidth = 1 + pulse * 1.2;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = (Math.PI / 3) * k + Math.PI / 6;
          const px = cx + Math.cos(a) * (r - 2), py = cy + Math.sin(a) * (r - 2);
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.stroke();
      }
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
