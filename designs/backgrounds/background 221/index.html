<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 221 — Kinetic Swiss Bauhaus Color Blocks</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f1ea; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  const COLS = ['#ef4444', '#2563eb', '#eab308', '#18181b', '#e5e0d5'];
  let w = 0, h = 0, dpr = 1, ptrX = -999, ptrY = -999;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { ptrX = e.clientX; ptrY = e.clientY; });
  function animate(now) {
    const t = now * 0.0008;
    ctx.fillStyle = '#f4f1ea'; ctx.fillRect(0, 0, w, h);
    const sz = 72; let idx = 0;
    for (let y = 0; y < h + sz; y += sz) for (let x = 0; x < w + sz; x += sz) {
      const d = Math.hypot(x - ptrX, y - ptrY);
      const shift = Math.exp(-d * d / 32000) * 18;
      const slide = Math.sin(t + idx * 0.7) * 8 + shift;
      ctx.fillStyle = COLS[idx % COLS.length];
      ctx.globalAlpha = 0.85;
      if (idx % 3 === 0) {
        ctx.beginPath(); ctx.arc(x + sz * 0.5 + slide, y + sz * 0.5, sz * 0.34, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillRect(x + 8 + slide, y + 8, sz - 16, sz - 16);
      }
      idx++;
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
