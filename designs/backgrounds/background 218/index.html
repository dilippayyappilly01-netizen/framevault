<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 218 — Golden Starburst Willow Sparks</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07060a; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, lastAuto = 0;
  const sparks = [];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  function burst(x, y) {
    const hue = 32 + Math.random() * 28;
    for (let i = 0; i < 42; i++) {
      const a = Math.random() * 6.283, sp = 1.2 + Math.random() * 4.2;
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue });
    }
  }
  window.addEventListener('pointerdown', (e) => { burst(e.clientX, e.clientY); });
  window.addEventListener('pointermove', (e) => { if (Math.random() > 0.72) sparks.push({ x: e.clientX, y: e.clientY, vx: (Math.random() - 0.5) * 1.5, vy: -Math.random() * 1.5, life: 0.9, hue: 42 }); });
  function animate(now) {
    ctx.fillStyle = 'rgba(7, 6, 10, 0.16)'; ctx.fillRect(0, 0, w, h);
    if (now - lastAuto > 1500) { lastAuto = now; burst(w * (0.2 + Math.random() * 0.6), h * (0.2 + Math.random() * 0.45)); }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i], ox = s.x, oy = s.y;
      s.vy += 0.045; s.vx *= 0.985; s.x += s.vx; s.y += s.vy; s.life -= 0.016;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.strokeStyle = `hsla(${s.hue}, 96%, 68%, ${s.life.toFixed(3)})`; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
