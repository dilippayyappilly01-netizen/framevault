<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 216 — Harmonic Chladni Acoustic Sand Plate</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #09090b; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, n = 3, m = 5;
  const grains = [];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!grains.length) for (let i = 0; i < 2400; i++) grains.push({ x: Math.random(), y: Math.random() });
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { n = 1 + Math.floor((e.clientX / Math.max(w, 1)) * 6); m = 2 + Math.floor((e.clientY / Math.max(h, 1)) * 6); });
  window.addEventListener('pointerdown', () => { for (let i = 0; i < grains.length; i++) { grains[i].x = Math.random(); grains[i].y = Math.random(); } });
  function animate() {
    ctx.fillStyle = 'rgba(9, 9, 11, 0.35)'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fde68a';
    for (let i = 0; i < grains.length; i++) {
      const g = grains[i];
      const v = Math.cos(n * Math.PI * g.x) * Math.cos(m * Math.PI * g.y) - Math.cos(m * Math.PI * g.x) * Math.cos(n * Math.PI * g.y);
      const jitter = Math.abs(v) * 0.025;
      g.x = Math.max(0.01, Math.min(0.99, g.x + (Math.random() - 0.5) * jitter));
      g.y = Math.max(0.01, Math.min(0.99, g.y + (Math.random() - 0.5) * jitter));
      ctx.fillRect(g.x * w, g.y * h, 1.8, 1.8);
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
