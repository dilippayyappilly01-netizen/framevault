<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 202 — Harmonic Lissajous Oscilloscope</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #040a08; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, ptrX = 0.5, ptrY = 0.5, tX = 0.5, tY = 0.5;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { tX = e.clientX / Math.max(w, 1); tY = e.clientY / Math.max(h, 1); });
  function animate(now) {
    const t = now * 0.001; ptrX += (tX - ptrX) * 0.06; ptrY += (tY - ptrY) * 0.06;
    ctx.fillStyle = 'rgba(4, 10, 8, 0.22)'; ctx.fillRect(0, 0, w, h);
    const fx = 2 + Math.round(ptrX * 4), fy = 3 + Math.round(ptrY * 4);
    const rx = w * 0.36, ry = h * 0.36;
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = k === 0 ? 'rgba(52, 211, 153, 0.85)' : k === 1 ? 'rgba(34, 211, 238, 0.45)' : 'rgba(163, 230, 53, 0.25)';
      ctx.lineWidth = k === 0 ? 1.8 : 1.1;
      ctx.beginPath();
      for (let i = 0; i <= 420; i++) {
        const a = (i / 420) * Math.PI * 2;
        const x = w * 0.5 + Math.sin(a * fx + t * 0.9 + k * 0.35) * rx;
        const y = h * 0.5 + Math.sin(a * fy + k * 0.45) * ry;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
