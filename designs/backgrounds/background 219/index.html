<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 219 — Golden Celestial Astrolabe Rings</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07080e; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, tx = 0, ty = 0, px = 0, py = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { tx = (e.clientX / Math.max(w, 1) - 0.5) * 0.8; ty = (e.clientY / Math.max(h, 1) - 0.5) * 0.8; });
  function animate(now) {
    const t = now * 0.0007; px += (tx - px) * 0.06; py += (ty - py) * 0.06;
    ctx.fillStyle = '#07080e'; ctx.fillRect(0, 0, w, h);
    const cx = w * 0.5, cy = h * 0.5, baseR = Math.min(w, h) * 0.38;
    for (let i = 0; i < 6; i++) {
      const r = baseR * (0.35 + i * 0.14);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * (i % 2 ? 1 : -1) * (0.4 + i * 0.15) + px);
      ctx.scale(1, 0.45 + 0.55 * Math.abs(Math.cos(py + i * 0.4)));
      ctx.strokeStyle = `rgba(245, 200, 102, ${(0.22 + i * 0.08).toFixed(2)})`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      const ma = t * (2 + i * 0.5);
      ctx.fillStyle = '#fef3c7'; ctx.beginPath(); ctx.arc(Math.cos(ma) * r, Math.sin(ma) * r, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
