<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 171 — Live ASCII Terrain Elevation Map</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #080c0a; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  const RAMP = ' .:-=+*#%@';
  let w = 0, h = 0, dpr = 1, ptrX = 0.5, ptrY = 0.5, tX = 0.5, tY = 0.5;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { tX = e.clientX / Math.max(w, 1); tY = e.clientY / Math.max(h, 1); });
  function animate(now) {
    const t = now * 0.0008;
    ptrX += (tX - ptrX) * 0.08; ptrY += (tY - ptrY) * 0.08;
    ctx.fillStyle = '#080c0a'; ctx.fillRect(0, 0, w, h);
    const step = 18;
    ctx.font = '600 13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let y = 9; y < h; y += step) {
      for (let x = 9; x < w; x += step) {
        const nx = x / w, ny = y / h;
        const d = Math.hypot(nx - ptrX, ny - ptrY);
        let elev = Math.sin(nx * 7 + t) * Math.cos(ny * 6 - t * 0.8) * 0.35
                 + Math.sin((nx + ny) * 11 - t * 1.2) * 0.2 + 0.45 + Math.exp(-d * d * 24) * 0.55;
        elev = Math.max(0, Math.min(0.999, elev));
        const ch = RAMP[Math.floor(elev * RAMP.length)];
        if (ch === ' ') continue;
        ctx.fillStyle = elev > 0.72 ? '#fbbf24' : elev > 0.45 ? '#34d399' : '#065f46';
        ctx.fillText(ch, x, y);
      }
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
