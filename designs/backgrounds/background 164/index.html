<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background 164 — Concentric Breathing Polygons</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06050c; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  let w = 0, h = 0, dpr = 1, ptrX = 0.5, ptrY = 0.5, tX = 0.5, tY = 0.5, sides = 6;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  window.addEventListener('pointermove', (e) => { tX = e.clientX / Math.max(w, 1); tY = e.clientY / Math.max(h, 1); });
  window.addEventListener('pointerdown', () => { sides = sides >= 9 ? 3 : sides + 1; });
  function animate(now) {
    const t = now * 0.001;
    ptrX += (tX - ptrX) * 0.07; ptrY += (tY - ptrY) * 0.07;
    ctx.fillStyle = '#06050c'; ctx.fillRect(0, 0, w, h);
    const maxR = Math.hypot(w, h) * 0.58;
    const count = 24;
    for (let i = 0; i < count; i++) {
      const u = ((i / count) + t * 0.08) % 1;
      const r = Math.pow(u, 1.5) * maxR;
      const cx = w * 0.5 + (ptrX - 0.5) * 160 * (1 - u);
      const cy = h * 0.5 + (ptrY - 0.5) * 160 * (1 - u);
      const rot = t * 0.35 + u * 1.4;
      ctx.strokeStyle = `hsla(${Math.round(210 + u * 110)}, 90%, 66%, ${(Math.sin(u * Math.PI) * 0.72).toFixed(3)})`;
      ctx.lineWidth = 1.2 + u * 1.6;
      ctx.beginPath();
      for (let s = 0; s <= sides; s++) {
        const a = rot + (s / sides) * Math.PI * 2;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
